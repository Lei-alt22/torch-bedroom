<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#10191b"><title>烛影地宫 · 火把光照实测</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c1114;touch-action:none;font-family:system-ui,sans-serif}canvas{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;display:block}#hud{position:fixed;top:max(14px,env(safe-area-inset-top));left:max(18px,env(safe-area-inset-left));color:#d8c7a6;text-shadow:0 2px #0a0d0f;pointer-events:none}#hud b{font-size:16px;letter-spacing:2px}#hud small{display:block;color:#a7a99b;font-size:11px;margin-top:5px}#toggle{position:fixed;right:max(25px,env(safe-area-inset-right));bottom:max(28px,env(safe-area-inset-bottom));border:2px solid #c7a06b;background:#3c3025;color:#f8d5a0;border-radius:14px;padding:14px 20px;font-size:15px;font-weight:bold;box-shadow:0 5px 0 #1a1715;touch-action:manipulation}#hint{position:fixed;left:max(18px,env(safe-area-inset-left));bottom:max(20px,env(safe-area-inset-bottom));color:#e4d5ba;font-size:12px;opacity:.86;pointer-events:none}@media(max-width:650px){#hud b{font-size:13px}#hint{max-width:180px;font-size:10px}#toggle{padding:11px}}</style></head><body><canvas id="game"></canvas><div id="hud"><b>烛影地宫 · 光照验证场景</b><small>等距像素卧室 · 动态火把 · 家具投影 · 墙体遮挡</small></div><div id="hint">左侧触摸拖动移动 · 右侧火把开关<br>电脑：WASD / 方向键移动 · F 开关火把</div><button id="toggle">熄灭火把</button><script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});const W=480,H=360;canvas.width=W;canvas.height=H;ctx.imageSmoothingEnabled=false;
const iso=(x,y,z=0)=>({x:240+(x-y)*24,y:90+(x+y)*12-z*24});const poly=(p,c,stroke)=>{ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y);ctx.closePath();ctx.fillStyle=c;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}};const quad=(a,b,c,d,col,stroke)=>poly([iso(...a),iso(...b),iso(...c),iso(...d)],col,stroke);const block=(x,y,w,d,h,top,left,right)=>{quad([x,y,h],[x+w,y,h],[x+w,y+d,h],[x,y+d,h],top,'#151f20');quad([x,y+d,h],[x+w,y+d,h],[x+w,y+d,0],[x,y+d,0],left);quad([x+w,y,h],[x+w,y+d,h],[x+w,y+d,0],[x+w,y,0],right)};
let px=3.1,py=4.7,torch=true,frame=0,joy=null;const keys=new Set();const solids=[{x:.65,y:1.05,w:1.45,d:2.1,h:.6},{x:4.65,y:1.0,w:1.55,d:.85,h:.8},{x:5.1,y:3.8,w:.85,d:1.1,h:1.45},{x:.65,y:5.0,w:1.15,d:.7,h:.75}];const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const inside=(x,y,o,m=.18)=>x>o.x-m&&x<o.x+o.w+m&&y>o.y-m&&y<o.y+o.d+m;
function room(){// dark room shell
quad([0,0,0],[7,0,0],[7,7,0],[0,7,0],'#263734');
// back walls
quad([0,0,0],[7,0,0],[7,0,3],[0,0,3],'#53605a','#273330');quad([0,0,0],[0,7,0],[0,7,3],[0,0,3],'#394b49','#273330');
for(let x=0;x<7;x++)for(let y=0;y<7;y++){const v=(x*19+y*11)%5;quad([x,y,0],[x+1,y,0],[x+1,y+1,0],[x,y+1,0],['#394b46','#3d4e48','#41534b','#3b4b45','#405148'][v],'#30413b');if((x*7+y*3)%9===0){const p=iso(x+.36,y+.52,.005);ctx.fillStyle='#6b7766';ctx.fillRect(p.x,p.y,3,1)}}
// wall bricks
ctx.strokeStyle='#63716a';ctx.lineWidth=1;for(let z=.45;z<3;z+=.65){let a=iso(0,0,z),b=iso(7,0,z);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();a=iso(0,0,z);b=iso(0,7,z);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
// wall window + hanging frame
quad([2.7,0,1.25],[4.05,0,1.25],[4.05,0,2.55],[2.7,0,2.55],'#182d32','#9a805d');quad([3.27,0,1.25],[3.4,0,1.25],[3.4,0,2.55],[3.27,0,2.55],'#9c8866');quad([2.7,0,1.85],[4.05,0,1.85],[4.05,0,1.94],[2.7,0,1.94],'#9c8866');
quad([0,2.25,1.3],[0,3.35,1.3],[0,3.35,2.25],[0,2.25,2.25],'#746c4d','#b89a65');
// floor rug
quad([2.45,2.45,.01],[4.7,2.45,.01],[4.7,4.45,.01],[2.45,4.45,.01],'#67514b','#ae8a60');quad([2.65,2.65,.02],[4.5,2.65,.02],[4.5,4.25,.02],[2.65,4.25,.02],'#795d50','#d1a676');
}
function furniture(o,i){const {x,y,w,d,h}=o;if(i===0){block(x,y,w,d,.37,'#675344','#4d3931','#3c2f2a');block(x+.08,y+.08,w-.16,d-.16,.53,'#a99a76','#7e775f','#6c6557');quad([x+.12,y+.13,.56],[x+w-.12,y+.13,.56],[x+w-.12,y+.65,.56],[x+.12,y+.65,.56],'#bfc1a4');quad([x+.13,y+.75,.57],[x+w-.13,y+.75,.57],[x+w-.13,y+d-.13,.57],[x+.13,y+d-.13,.57],'#586d66','#2c4c48')}
else if(i===1){block(x,y,w,d,h,'#71523a','#49382b','#3e2e27');block(x+.1,y+.1,w-.2,d-.2,h+.06,'#866445','#5b4230','#4e3527');const p=iso(x+.3,y+.28,h+.1);ctx.fillStyle='#bfa679';ctx.fillRect(p.x-3,p.y-2,8,5)}
else if(i===2){block(x,y,w,d,h,'#62513b','#49382e','#392b24');for(let z=.35;z<1.3;z+=.4){quad([x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+.04],[x,y+d,z+.04],'#b28b56');const p=iso(x+.4,y+d+.01,z+.18);ctx.fillStyle='#bfa66e';ctx.fillRect(p.x,p.y,2,2)}}
else {block(x,y,w,d,h,'#795a40','#4d382a','#473023');quad([x+.05,y+.05,h+.02],[x+w-.05,y+.05,h+.02],[x+w-.05,y+d-.05,h+.02],[x+.05,y+d-.05,h+.02],'#9b7952');const p=iso(x+w*.5,y+d,h*.55);ctx.fillStyle='#d5b56b';ctx.fillRect(p.x,p.y,3,2)}}
function player(){const p=iso(px,py);ctx.fillStyle='#101819';ctx.beginPath();ctx.ellipse(p.x,p.y+2,10,4,0,0,Math.PI*2);ctx.fill();const bob=Math.round(Math.sin(frame*.085)*1.1);ctx.fillStyle='#2b3330';ctx.fillRect(p.x-5,p.y-12+bob,4,12);ctx.fillRect(p.x+2,p.y-12+bob,4,12);ctx.fillStyle='#827057';ctx.fillRect(p.x-7,p.y-28+bob,14,17);ctx.fillStyle='#554f42';ctx.fillRect(p.x-7,p.y-25+bob,3,12);ctx.fillStyle='#aa9170';ctx.fillRect(p.x-5,p.y-37+bob,10,10);ctx.fillStyle='#39372f';ctx.fillRect(p.x-7,p.y-39+bob,14,5);ctx.fillStyle='#d2b087';ctx.fillRect(p.x+4,p.y-32+bob,3,3);ctx.fillStyle='#a38b64';ctx.fillRect(p.x+7,p.y-27+bob,9,3);ctx.fillStyle='#604a35';ctx.fillRect(p.x+14,p.y-33+bob,2,10);if(torch){ctx.fillStyle='#e4a953';ctx.fillRect(p.x+12,p.y-37+bob,6,6);ctx.fillStyle='#ffe3a0';ctx.fillRect(p.x+14,p.y-39+bob-(frame%5===0?2:0),3,5)}}
function shadowPolygon(lx,ly,rect){let points=[[rect.x,rect.y],[rect.x+rect.w,rect.y],[rect.x+rect.w,rect.y+rect.d],[rect.x,rect.y+rect.d]].map(([x,y])=>iso(x,y));const center=iso(lx,ly);const angles=points.map(p=>Math.atan2(p.y-center.y,p.x-center.x));let best=null;for(let i=0;i<4;i++)for(let j=i+1;j<4;j++){let diff=Math.abs(angles[i]-angles[j]);diff=Math.min(diff,Math.PI*2-diff);if(!best||diff>best.diff)best={i,j,diff}}const a=points[best.i],b=points[best.j];const ext=p=>({x:p.x+(p.x-center.x)*9,y:p.y+(p.y-center.y)*9});return [a,b,ext(b),ext(a)]}
const shade=document.createElement('canvas');shade.width=W;shade.height=H;const sc=shade.getContext('2d');function lighting(){sc.clearRect(0,0,W,H);sc.fillStyle='rgba(4,10,13,.91)';sc.fillRect(0,0,W,H);if(torch){let p=iso(px+.48,py-.12,1.18);p.y-=8;let rad=108+Math.sin(frame*.23)*3+Math.sin(frame*.57)*2;sc.globalCompositeOperation='destination-out';const g=sc.createRadialGradient(p.x,p.y,3,p.x,p.y,rad);g.addColorStop(0,'rgba(0,0,0,.93)');g.addColorStop(.24,'rgba(0,0,0,.82)');g.addColorStop(.65,'rgba(0,0,0,.39)');g.addColorStop(1,'rgba(0,0,0,0)');sc.fillStyle=g;sc.fillRect(0,0,W,H);sc.globalCompositeOperation='source-over';sc.fillStyle='rgba(3,9,12,.72)';for(const o of solids){if(inside(px,py,o,.12))continue;const pts=shadowPolygon(px+.48,py-.12,o);sc.beginPath();sc.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)sc.lineTo(pts[i].x,pts[i].y);sc.closePath();sc.fill()} // solid back wall blocks light beyond room
sc.globalCompositeOperation='source-over'}ctx.drawImage(shade,0,0);if(torch){let p=iso(px+.48,py-.12,1.18);p.y-=8;const gl=ctx.createRadialGradient(p.x,p.y,1,p.x,p.y,52);gl.addColorStop(0,'rgba(255,188,89,.24)');gl.addColorStop(.45,'rgba(244,141,47,.10)');gl.addColorStop(1,'rgba(244,141,47,0)');ctx.fillStyle=gl;ctx.fillRect(p.x-52,p.y-52,104,104);ctx.fillStyle='#fff1ad';ctx.fillRect(p.x-1,p.y-1,3,3)}}
function draw(){frame++;ctx.fillStyle='#10191b';ctx.fillRect(0,0,W,H);room();const things=solids.map((o,i)=>({y:o.y+o.d,fn:()=>furniture(o,i)}));things.push({y:py,fn:player});things.sort((a,b)=>a.y-b.y);for(const t of things)t.fn();lighting();requestAnimationFrame(draw)}
let last=performance.now();function update(now){const dt=Math.min((now-last)/1000,.04);last=now;let dx=0,dy=0;if(keys.has('w')||keys.has('arrowup')){dx-=1;dy-=1}if(keys.has('s')||keys.has('arrowdown')){dx+=1;dy+=1}if(keys.has('a')||keys.has('arrowleft')){dx-=1;dy+=1}if(keys.has('d')||keys.has('arrowright')){dx+=1;dy-=1}if(joy){dx+=joy.dx;dy+=joy.dy}let len=Math.hypot(dx,dy);if(len>.01){dx/=Math.max(1,len);dy/=Math.max(1,len);let nx=clamp(px+dx*dt*2.2,.35,6.65),ny=clamp(py+dy*dt*2.2,.35,6.65);if(!solids.some(o=>inside(nx,py,o)))px=nx;if(!solids.some(o=>inside(px,ny,o)))py=ny}requestAnimationFrame(update)}
function joystickPos(e){const rect=canvas.getBoundingClientRect();return{x:(e.clientX-rect.left)/rect.width,y:(e.clientY-rect.top)/rect.height}}canvas.addEventListener('pointerdown',e=>{const p=joystickPos(e);if(p.x<.73){joy={id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,dy:0};canvas.setPointerCapture(e.pointerId)}});canvas.addEventListener('pointermove',e=>{if(joy&&joy.id===e.pointerId){const vx=e.clientX-joy.x,vy=e.clientY-joy.y;const m=Math.max(40,Math.hypot(vx,vy));joy.dx=clamp((vx*1.0+vy*2.0)/m,-1,1);joy.dy=clamp((vy*2.0-vx*1.0)/m,-1,1)}});for(const ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,e=>{if(joy&&joy.id===e.pointerId)joy=null});document.addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.key.toLowerCase()==='f')flip();if(e.key.startsWith('Arrow'))e.preventDefault()});document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));function flip(){torch=!torch;document.getElementById('toggle').textContent=torch?'熄灭火把':'点燃火把'}document.getElementById('toggle').addEventListener('click',flip);requestAnimationFrame(draw);requestAnimationFrame(update);
</script></body></html>
